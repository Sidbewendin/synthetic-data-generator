[project]
name = "synthgen"
version = "0.1.0"
description = "Générateur de données synthétiques configurables (CSV/JSON, stockage DuckDB)"
requires-python = ">=3.10"
dependencies = [
    "faker>=24.0",
    "duckdb>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/synthgen"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]